<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12946b"/>
      <stop offset="1" stop-color="#0a5f45"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- ₣ stylisé (franc) en blanc -->
  <g fill="#ffffff">
    <!-- fût vertical -->
    <rect x="206" y="150" width="46" height="212" rx="10"/>
    <!-- bras supérieur -->
    <rect x="206" y="150" width="138" height="46" rx="10"/>
    <!-- bras milieu -->
    <rect x="206" y="230" width="110" height="44" rx="10"/>
    <!-- barre du franc (traverse le fût) -->
    <rect x="182" y="296" width="118" height="32" rx="10"/>
  </g>
</svg>
